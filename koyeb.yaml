app: queen-stone-gallery
services:
  - name: web
    type: web
    git:
      branch: main
    dockerfile: Dockerfile
    ports:
      - port: 8000
        path: /
    routes:
      - path: /
        port: 8000
    regions:
      - sin
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
    # LƯU Ý BẢO MẬT: Mật khẩu ADMIN_PASSWORD và ADMIN_PIN bắt buộc thiết lập qua
    # Bảng điều khiển Koyeb Secrets (Settings > Secrets), tuyệt đối không ghi vào Git.
    # Cấu hình Ổ cứng bền vững (Persistent Volume) để bảo toàn dữ liệu SQLite và Ảnh Upload:
    # volumes:
    #   - name: qs-data
    #     path: /app/data
    #   - name: qs-uploads
    #     path: /app/public/uploads
    health_checks:
      - http:
          port: 8000
          path: /api/v1/health
        interval: 30
        timeout: 5

