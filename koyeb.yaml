app: queen-stone-gallery
services:
  - name: web
    type: web
    git:
      branch: main
    dockerfile: Dockerfile
    ports:
      - port: 8000
        path: /
    routes:
      - path: /
        port: 8000
    regions:
      - sin
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: ADMIN_USERNAME
        value: Admin
      - key: ADMIN_PASSWORD
        value: "8888"
      - key: ADMIN_PIN
        value: "1234"
    health_checks:
      - http:
          port: 8000
          path: /api/v1/health
        interval: 30
        timeout: 5
